CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Der konservative Verbindungsmodus vermeidet Probleme mit dem 2-Mbit-PHY.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Dieser ZMK-dokumentierte Workaround verbessert die Windows-Kompatibilität.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Die Erstkopplung funktioniert ohne Passcode-Eingabe über die Matrix.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
